spring.datasource.url=jdbc:h2:mem:publisher;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
document.storage.root=${java.io.tmpdir}/pdf-processor-publisher-tests
document.max-size-bytes=20971520
rabbitmq.queue.name=pdf.processing
