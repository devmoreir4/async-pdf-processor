spring.application.name=publisher
server.port=8081
rabbitmq.queue.name=pdf.processing

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pdf_processor}
spring.datasource.username=${DB_USERNAME:pdf_user}
spring.datasource.password=${DB_PASSWORD:pdf_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
document.max-size-bytes=20971520
document.storage.root=${DOCUMENT_STORAGE_ROOT:../storage}
