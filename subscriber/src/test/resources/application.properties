spring.datasource.url=jdbc:h2:mem:subscriber;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
rabbitmq.queue.name=pdf.processing
ocr.tesseract.command=tesseract
ocr.tesseract.languages=por+eng
ocr.text.minimum-characters-per-page=20
ocr.render-dpi=300
