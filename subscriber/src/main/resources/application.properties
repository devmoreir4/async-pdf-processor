spring.application.name=subscriber
server.port=8082
rabbitmq.queue.name=pdf.processing

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pdf_processor}
spring.datasource.username=${DB_USERNAME:pdf_user}
spring.datasource.password=${DB_PASSWORD:pdf_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

document.storage.root=${DOCUMENT_STORAGE_ROOT:../storage}
ocr.tesseract.command=${TESSERACT_COMMAND:tesseract}
ocr.tesseract.languages=${TESSERACT_LANGUAGES:por+eng}
ocr.text.minimum-characters-per-page=20
ocr.render-dpi=300
